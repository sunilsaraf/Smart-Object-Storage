apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-config
  namespace: smart-storage
data:
  milvus.yaml: |
    milvus:
      host: milvus-service
      port: 19530
      user: ""
      password: ""
      collection:
        name: object_chunks
        description: "Semantic embeddings of object storage chunks"
        schema:
          dimension: 768
          metric_type: "IP"
          index_type: "IVF_FLAT"
        index_params:
          nlist: 1024
        search_params:
          nprobe: 10
      connection:
        timeout: 30
        pool_size: 10
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-service
  namespace: smart-storage
spec:
  selector:
    app: milvus
  ports:
    - name: grpc
      protocol: TCP
      port: 19530
      targetPort: 19530
    - name: metrics
      protocol: TCP
      port: 9091
      targetPort: 9091
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  namespace: smart-storage
spec:
  serviceName: milvus-service
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
      - name: milvus
        image: milvusdb/milvus:v2.3.5
        command: ["milvus", "run", "standalone"]
        ports:
        - containerPort: 19530
          name: grpc
        - containerPort: 9091
          name: metrics
        env:
        - name: ETCD_ENDPOINTS
          value: "etcd-service:2379"
        - name: MINIO_ADDRESS
          value: "minio-service:9000"
        volumeMounts:
        - name: milvus-data
          mountPath: /var/lib/milvus
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
  volumeClaimTemplates:
  - metadata:
      name: milvus-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
